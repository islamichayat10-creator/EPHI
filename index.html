
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHCVS - Global Health Certificate Verification</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f6f8;
  color: #173b46;
}
header {
  background: #075b50;
  color: white;
  text-align: center;
  padding: 30px 15px;
}
header h1 {font-size: 32px;}
main {
  max-width: 650px;
  margin: 40px auto;
  padding: 20px;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 3px 15px #0002;
}
input {
  width: 90%;
  padding: 14px;
  margin: 15px 0;
  border: 1px solid #aaa;
  border-radius: 6px;
}
button {
  background: #087d68;
  color: white;
  border: none;
  padding: 14px 25px;
  border-radius: 6px;
}
footer {
  background: #173b46;
  color: white;
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>
<header>
<h1>GHCVS</h1>
<p>Global Health Certificate Verification System</p>
</header>
<main>
<div class="card">
<h2>Verify Health Certificate</h2>
<p>Enter your certificate reference number.</p>
<input type="text" placeholder="Certificate ID">
<br>
<button onclick="alert('Verification service is under development.')">
Verify Certificate
</button>
</div>
</main>
<footer>
<p>GHCVS | 2026</p>
<p>Development prototype – Not an official certificate service</p>
</footer>
</body>
</html>
